<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DiskMigrator 로고 락업</title>
<style>
  :root {
    --ground: #ffffff;
    --ink: #26282B;
    --rule: #D9D3CA;
    --label: #57606A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #26282B; --ink: #ffffff; --rule: #3A3D42; --label: #7E838A; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ground);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 4rem 1.5rem;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /*
    로고 락업 = 마크 + 세로 구분선 + 워드마크. 세 요소의 간격·비율이 정체성입니다.
    - 마크 폭 150px 기준. 워드마크 글자 크기 23px.
    - 마크와 워드마크 사이 간격 1.375rem, 구분선 왼쪽 여백도 1.375rem.
    - 워드마크는 전부 대문자, 자간 0.34em.
    - 마크는 D=채움 / M=획이라 색을 color(currentColor)로 한 번에 줍니다.
  */
  .lockup { display: flex; align-items: center; gap: 1.375rem; }
  .mark { width: 150px; flex: none; color: var(--ink); }
  .mark svg { display: block; width: 100%; height: auto; }
  .wordmark { border-left: 1px solid var(--rule); padding-left: 1.375rem; }
  .wordmark .name {
    font-size: 23px;
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--label);
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="lockup">
    <div class="mark">
      <svg viewBox="56 95 256 165" xmlns="http://www.w3.org/2000/svg" aria-label="DiskMigrator">
        <path fill="currentColor" fill-rule="evenodd"
          d="m 95.984375,107.03125 h 50.031255 c 42.9432,0 69.21758,31.95561 69.17612,61.12102 -0.0446,31.36872 -17.96704,62.86336 -69.17612,62.86336 H 95.984375 c -13.254834,0 -24,-10.74517 -24,-24 v -75.98438 c 0,-13.25483 10.745166,-24 24,-24 z m 14.000005,32.67188 h 36.03125 c 28,0 37.68751,16.98437 37.68751,29.98437 0,13 -9.68751,28.65626 -37.68751,28.65626 h -36.03125 z"/>
        <path fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round"
              stroke-linejoin="miter" stroke-miterlimit="2.2"
              d="M 180.03125,138.04688 213.39063,229.34375 284,120 280.01563,232"/>
      </svg>
    </div>
    <div class="wordmark"><span class="name">DiskMigrator</span></div>
  </div>
</body>
</html>
